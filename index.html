<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroSeva — Find Astrologers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>AstroSeva</h1>
    <a href="login.html" class="btn btn-outline btn-sm">Login</a>
  </header>

  <main class="container">
    <h2 style="margin-bottom: 16px;">Available Astrologers</h2>
    <div id="astroList"></div>
    <div id="emptyState" style="text-align: center; color: var(--text-light); display: none;">
      <p>No astrologers available yet.</p>
      <a href="register.html" class="btn btn-outline" style="margin-top: 10px;">Register as Astrologer</a>
    </div>
  </main>

  <div id="installPrompt">Install AstroSeva App</div>

  <script src="app.js"></script>
  <script>
    function renderAstros() {
      const list = document.getElementById('astroList');
      const empty = document.getElementById('emptyState');
      const astros = DB.getApprovedAstros();

      if (astros.length === 0) {
        empty.style.display = 'block';
        return;
      }

      list.innerHTML = astros.map(a => `
        <div class="card">
          <div class="astro-card">
            <img src="${a.image || 'https://via.placeholder.com/60'}" class="astro-avatar" alt="${a.name}">
            <div class="astro-info">
              <h3>${a.name}</h3>
              <p>📍 ${a.location}</p>
              <p>₹${a.fees} / session</p>
              <div class="astro-meta">
                <span>⭐ 5.0</span>
              </div>
            </div>
          </div>
          <div class="astro-actions">
            <button onclick="promptName('${a.id}')" class="btn btn-outline btn-sm" style="flex:1">💬 Chat</button>
            <a href="chat.html?astro=${a.id}" id="chatLink_${a.id}" style="display:none;"></a>
            <button onclick="bookSession('${a.id}')" class="btn btn-sm" style="flex:1">Book Session</button>
          </div>
        </div>
      `).join('');
    }

    function promptName(astroId) {
      const name = prompt("Enter your name to start chatting:");
      if (name && name.trim()) {
        sessionStorage.setItem('customerName', name.trim());
        window.location.href = `chat.html?astro=${astroId}`;
      }
    }

    function bookSession(astroId) {
      const name = prompt("Enter your name for the booking:");
      if (!name) return;
      const date = prompt("Enter date (e.g., 2024-12-25):");
      if (!date) return;
      
      DB.addBooking({ id: Date.now(), astroId, customerName: name, date, status: 'confirmed' });
      alert('Session booked successfully!');
    }

    renderAstros();

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installPrompt');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
