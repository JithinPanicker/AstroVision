<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a16" />
<meta name="description" content="AstroSeva — Book verified astrologers for kundli, tarot, vastu, numerology and more." />
<title>AstroSeva — Book Astrologers</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b0a16'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23ffc857' stroke-width='18'/%3E%3Ccircle cx='256' cy='256' r='52' fill='%23ffc857'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230b0a16'/%3E%3Ccircle cx='256' cy='256' r='150' fill='none' stroke='%23ffc857' stroke-width='18'/%3E%3Ccircle cx='256' cy='256' r='52' fill='%23ffc857'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">✦</span>
      <div class="brand-text">
        <h1>AstroSeva</h1>
        <p>Talk to verified astrologers</p>
      </div>
    </div>
    <button class="icon-btn" id="installBtn" hidden title="Install app" aria-label="Install app">⤓</button>
  </header>

  <main class="main">

    <!-- ================= ASTROLOGERS VIEW ================= -->
    <section id="view-astrologers" class="view">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" placeholder="Search by name, skill or language…"
               autocomplete="off" aria-label="Search astrologers" />
      </div>

      <div class="chips" id="filterChips" role="tablist" aria-label="Filter by expertise"></div>

      <div class="astro-list" id="astroList"></div>

      <div class="empty" id="astroEmpty" hidden>
        <span class="empty-ico">🔭</span>
        <p>No astrologers match your search.</p>
      </div>
    </section>

    <!-- ================= BOOKINGS VIEW ================= -->
    <section id="view-bookings" class="view" hidden>
      <h2 class="section-heading">My Bookings</h2>
      <div class="booking-list" id="bookingList"></div>

      <div class="empty" id="bookingEmpty" hidden>
        <span class="empty-ico">🗓️</span>
        <p>No bookings yet.<br />Pick an astrologer to schedule your first session.</p>
        <button class="btn-primary small" id="goBrowse">Browse astrologers</button>
      </div>
    </section>

  </main>

  <!-- ================= TAB BAR ================= -->
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="astrologers">
      <span class="tab-ico" aria-hidden="true">🔮</span>
      <span>Astrologers</span>
    </button>
    <button class="tab" data-tab="bookings">
      <span class="tab-ico" aria-hidden="true">🗓️</span>
      <span>Bookings</span>
      <span class="badge-count" id="bookingCount" hidden>0</span>
    </button>
  </nav>
</div>

<!-- ================= OVERLAY + BOTTOM SHEET ================= -->
<div class="overlay" id="overlay" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Book a session" hidden>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
