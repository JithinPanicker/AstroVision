<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - AstroSeva</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">AstroSeva</a>
    </div>
  </header>

  <div class="auth-box" style="max-width:500px;">
    <h2>Apply as Astrologer</h2>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="regPhone" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" required>
      </div>
      <div class="form-group">
        <label>Skills (e.g., Vedic, Tarot)</label>
        <input type="text" id="regSkills" required>
      </div>
      <div class="form-group">
        <label>Consultation Fee (₹)</label>
        <input type="number" id="regFees" required>
      </div>
      <div class="form-group">
        <label>Profile Image URL (optional)</label>
        <input type="url" id="regImage" placeholder="https://...">
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Submit Application</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
