<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - AstroSeva</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">AstroSeva</a>
    </div>
  </header>

  <div class="auth-box">
    <h2>Sign In</h2>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('admin')">Admin</button>
      <button class="tab-btn" onclick="switchTab('astro')">Astrologer</button>
    </div>

    <!-- Admin Form -->
    <form id="adminForm" onsubmit="handleAdmin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adUser" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adPass" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Login as Admin</button>
    </form>

    <!-- Astro Form -->
    <form id="astroForm" style="display:none;" onsubmit="handleAstro(event)">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="asPhone" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="asPass" required>
      </div>
      <div class="form-group">
        <label>Login Code (Sent via SMS)</label>
        <input type="text" id="asCode" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Login as Astrologer</button>
    </form>
  </div>

  <script src="app.js"></script>
  <script>
    function switchTab(type) {
      document.getElementById('adminForm').style.display = type === 'admin' ? 'block' : 'none';
      document.getElementById('astroForm').style.display = type === 'astro' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === (type==='admin'?0:1)));
    }

    function handleAdmin(e) {
      e.preventDefault();
      const u = document.getElementById('adUser').value;
      const p = document.getElementById('adPass').value;
      if (u === 'admin' && p === 'admin') {
        sessionStorage.setItem('astroseva_auth', JSON.stringify({ role: 'admin' }));
        window.location.href = 'admin.html';
      } else {
        alert('Invalid Admin credentials (use admin/admin)');
      }
    }

    function handleAstro(e) {
      e.preventDefault();
      const phone = document.getElementById('asPhone').value;
      const pass = document.getElementById('asPass').value;
      const code = document.getElementById('asCode').value;

      const astros = DB.getAstros();
      const astro = astros.find(a => a.phone === phone && a.password === pass);

      if (!astro) return alert('Invalid phone or password');
      if (astro.status !== 'approved') return alert('Account pending approval');
      if (astro.loginCode !== code) return alert('Invalid login code');

      sessionStorage.setItem('astroseva_auth', JSON.stringify({ role: 'astro', astroId: astro.id }));
      window.location.href = 'astro-dashboard.html';
    }
  </script>
</body>
</html>
