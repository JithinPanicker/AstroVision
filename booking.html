<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Consultation - AstroSeva</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">AstroSeva</a>
    </div>
  </header>

  <main class="container">
    <div class="booking-wrapper">
      <div class="booking-sidebar">
        <h2 style="color:#DC3558; margin-bottom:24px;">Book Consultation</h2>
        <div class="stepper">
          <div class="step active">
            <div class="step-icon">1</div>
            <div>Personal Details</div>
          </div>
          <div class="step">
            <div class="step-icon">2</div>
            <div>Payment</div>
          </div>
          <div class="step">
            <div class="step-icon">3</div>
            <div>Confirmation</div>
          </div>
        </div>
      </div>
      
      <div class="booking-content">
        <h3 style="margin-bottom:20px;">Booking with <span id="bkAstroName" style="color:#DC3558;"></span></h3>
        
        <form id="bookingForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="bkName" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="bkPhone" placeholder="10-digit mobile number" required>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="bkDob" required>
          </div>

          <div style="background:#f8f8f8; padding:16px; border-radius:8px; margin:20px 0;">
            <p style="font-size:14px; margin-bottom:4px;">Consultation Fee: <strong id="bkAstroFee" style="color:#DC3558; font-size:18px;"></strong></p>
            <small style="color:#666;">Extension charges apply per minute after 1 hour.</small>
          </div>

          <button type="submit" class="btn-primary" style="width:100%; padding:12px; font-size:16px;">Make Payment & Book</button>
        </form>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
